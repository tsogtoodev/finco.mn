locale: en
key: about
about:
  hero:
    headline: Bringing the future closer. Delivering solutions today.
    intro: "\"Finco Capital NBFI\" LLC was founded in 2005 as one of Mongolia's
      pioneering financial companies, established with the mission of bringing
      world-class quality and innovation to deliver the most modern,
      best-in-class professional financial services to its customers, quickly
      and reliably. Finco Capital NBFI LLC is a team united by the mission of
      delivering modern financial services tailored to the real needs of
      individuals and businesses through technology- and data-driven solutions."
    photo: /images/about/hero.png
  mission:
    blocks:
      - badge: Our mission
        heading: Building your stable financial future, together
        body: Through a creative approach, digital solutions, a sense of ownership and
          professional service, we deliver every customer's financial needs
          fairly, accessibly, quickly and reliably.
      - badge: Our vision
        heading: We build a healthy financial ecosystem
        body: Grounded in technology and innovation, we deliver stable, accessible
          financial solutions to every customer.
  values:
    heading: Our values
    subheading: We bring financial solutions together in one place and power your
      next stage of growth.
    items:
      - title: The customer is our CENTRE
        body: We tailor every service to the real needs and goals of our customers and
          deliver it through smart solutions.
        align: left
      - title: Building the future from today
        body: We build not only for today, but for tomorrow's opportunities, together.
        align: center
      - title: Smart solutions, creative thinking
        body: We combine data, algorithms and innovation to offer each customer a
          solution made for them.
        align: right
      - title: Digital accessibility
        body: We simplify the customer experience so every service can be accessed from
          anywhere, at any time.
        align: left
      - title: Trust
        body: Built on transparency, reliable systems and ethical technology, we create
          lasting, growing relationships.
        align: right
  history:
    heading: Our journey
    subheading: The customer is our centre. We deliver reliable, innovative, smart
      solutions with transparency and trust, building today's and tomorrow's
      growth through financial opportunity.
    milestones:
      - year: "2005"
        body: The company was founded and began operations as one of the pioneering
          participants in Mongolia's NBFI sector.
      - year: "2023"
        body: We carried out a strategic and brand renewal and, under the name "Finco
          Capital NBFI", started a new chapter in digital finance.
      - year: "2024"
        body: We launched the Beep App, bringing short-term and employee online lending
          services to customers.
      - year: "2025"
        body: We introduced FincoBiz, a digital financing platform for SMEs,
          digitalising the business financing process.
      - year: "2025"
        body: Together with Premium Nexus JSC, we introduced the BeepCU Virtual Credit
          Card to the market, expanding the embedded finance ecosystem.
      - year: "2026"
        body: We are expanding the development of embedded finance services, delivering
          on the goal of managing the financial ecosystem for individuals and
          businesses on a single platform.
  ceo:
    headingLead: "A message from the "
    headingAccent: CEO
    subheading: The customer is our centre. We deliver reliable, innovative, smart
      solutions with transparency and trust, building today's and tomorrow's
      growth together.
    greetingTitle: Greetings
    greetingBody:
      - "For us at Finco, 2025 was not just a year of loan-portfolio growth — it
        was a pivotal starting point where we sharpened our strategic direction
        and began delivering digital financial solutions in earnest. In
        developing technology-driven financial solutions, our aim goes beyond
        launching products: we strive to simplify customers' everyday lives and
        create real value."
      - We also uphold our responsibility to customers and partners,
        consistently applying international standards in corporate governance,
        risk management and information security, and strengthening the
        foundation for long-term growth together with our customers. Trust is
        our most important value, and we are committed to working transparently
        and responsibly with every customer and partner. Finco Capital will
        understand its customers' needs, create real value, and steadily develop
        financial solutions close to their lives to build sustainable growth. We
        once again thank you all for your trust and partnership. Together we
        will build a smarter, more innovative and growing financial future.
    tagline: Let's build, finance the future.
    signatureLabel: "Chief Executive Officer:"
    signatureName: L. Tsolmon
    portrait: /images/about/ceo.png
  board:
    headingLead: "Board of "
    headingAccent: directors
    members:
      - name: G. Bat-Erdene
        role: Chairman of the Board
        bio: A leader with 20+ years of experience in finance. Responsible for financial
          strategy, budgeting and risk management at Premium Corporation LLC.
        photo: /images/about/board-1.png
      - name: N. Enkhbold
        role: Board member
        bio: 15+ years of experience in business strategy and investment. Serves as CEO
          of Wave Three Investment Partners LLC.
        photo: /images/about/board-2.png
      - name: B. Ganzorig
        role: Board member
        bio: Broad experience in strategic management and business development. Works as
          CEO at Wave Three Investment Partners LLC.
        photo: /images/about/board-3.png
      - name: L. Tsolmon
        role: Board member
        bio: Specialised in commerce and business development. Serves as Director of
          Commerce at Premium Innova LLC.
        photo: /images/about/ceo.png
      - name: B. Bayartbileg
        role: Independent board member
        bio: 15+ years of experience in business strategy and investment. Serves as CEO
          of Wave Three Investment Partners LLC.
        photo: /images/about/board-5.png
      - name: B. Munkhbat
        role: Independent board member
        bio: A leader with 20+ years of experience in finance. Responsible for financial
          strategy, budgeting and risk management at Premium Corporation LLC.
        photo: /images/about/board-6.png
  org:
    headingLead: "Organisational "
    headingAccent: structure
    subheading: Premium Corporation LLC's structure is designed to ensure fast
      decision-making, high accountability and efficient operations.
    root: Board
    ceo: Chief Executive Officer
    departments:
      - Head of Sales & Operations
      - Marketing & Business Development
      - Technology Division
      - Finance Division
      - Risk & Compliance Division
