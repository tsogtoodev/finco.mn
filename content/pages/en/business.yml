faq:
  - question: What documents do I need to apply for a loan?
    answer: Finco Capital NBFI LLC provides financial services within the framework
      of the relevant laws and regulations. The information published on this
      website is for general information purposes only and does not fully
      represent the final terms or decisions of any financial service. Terms,
      criteria and limits may vary depending on the product type and the
      customer's assessment.
  - question: Do I have to visit a branch in person?
    answer: No. You can submit your loan application fully online through the Beep
      Wallet app or the website.
  - question: How do I apply for a loan online?
    answer: Sign in to the Beep Wallet app, choose your loan type, fill in the
      required details and submit your application to receive a response within
      a short time.
  - question: What interest rates apply to loans?
    answer: The interest rate is set based on the product type, the loan term and
      the customer's credit assessment.
  - question: Can the loan term be extended?
    answer: Yes. For some products the loan term can be extended in accordance with
      the set conditions.
