locale: mn
key: about
about:
  hero:
    headline: Ирээдүйг ойртуулна. Өнөөдөрт шийдэл өгнө.
    intro: '"Финко Капитал ББСБ" ХХК нь 2005 онд үүсгэн байгуулагдсан ба дэлхийн
      жишигт нийцсэн чанар, инновацийг нэвтрүүлэн хамгийн шинэлэг, шилдэг
      мэргэжлийн санхүүгийн үйлчилгээг хэрэглэгчдэдээ түргэн шуурхай хүргэх
      эрхэм зорилготойгоор үүсгэн байгуулагдсан санхүүгийн ууган компаниудын нэг
      юм. "Финко Капитал ББСБ" ХХК нь технологи, датад суурилсан шийдлээр хувь
      хүн болон бизнесийн бодит хэрэгцээнд нийцсэн санхүүгийн орчин үеийн
      үйлчилгээг хүргэх эрхэм зорилгын дор нэгдсэн хамт олон юм.'
    photo: /images/about/hero.png
  mission:
    blocks:
      - badge: Эрхэм зорилго
        heading: Таны санхүүгийн тогвортой ирээдүйг хамтдаа бүтээнэ
        body: Бид бүтээлч хандлага, дижитал шийдэл, өөриймсөг сэтгэлгээ, мэргэжлийн
          үйлчилгээгээр хэрэглэгч бүрийн санхүүгийн хэрэгцээг шударга,
          хүртээмжтэй, хурдан, найдвартай хүргэнэ.
      - badge: Алсын хараа
        heading: Бид эрүүл санхүүгийн экосистемийг бүтээнэ
        body: Технологи болон инновацид тулгуурлан хэрэглэгч бүрт тогтвортой,
          хүртээмжтэй санхүүгийн шийдлийг хүргэнэ.
  values:
    heading: Бидний үнэт зүйл
    subheading: Санхүүгийн шийдлийг нэг дор төвлөрүүлж, таны дараагийн өсөлтийг дэмжинэ.
    items:
      - title: Хэрэглэгч бол бидний ТӨВ цэг
        body: Бид үйлчилгээ бүрээ хэрэглэгчийн бодит хэрэгцээ, зорилгод нийцүүлэн
          ухаалаг шийдлээр хүргэдэг.
        align: left
      - title: Ирээдүйг өнөөдрөөс бүтээх сэтгэлгээ
        body: Бид зөвхөн өнөөдрийнг биш, маргаашийн боломжийг хамтдаа бүтээдэг.
        align: center
      - title: Ухаалаг шийдэл, бүтээлч сэтгэлгээ
        body: Бид дата, алгоритм, инновацыг хослуулан хэрэглэгч бүрдээ тохирсон шийдэл
          санал болгодог
        align: right
      - title: Дижитал хүртээмж
        body: Хэрэглэгчийн туршлагыг хялбаршуулж, бүх үйлчилгээг хүссэн газраасаа,
          хүссэн үедээ авах боломжийг бүрдүүлнэ.
        align: left
      - title: Итгэлцэл
        body: Ил тод байдал, найдвартай систем, ёс зүйтэй технологид тулгуурлан урт
          хугацааны тогвортой, өсөлттэй харилцааг бий болгодог.
        align: right
  history:
    heading: Түүхэн замнал
    subheading: Хэрэглэгч бол бидний төв. Бид тэдэнд найдвартай, инновацтай, ухаалаг
      шийдлүүдийг ил тод, итгэлцэлтэйгээр хүргэж, өнөөдөр болон маргаашийн
      өсөлтийг санхүүгийн боломжоор бүтээнэ.
    milestones:
      - year: "2005"
        body: Компани анх үүсгэн байгуулагдаж, Монголын ББСБ-ын салбарын анхдагч
          оролцогчдын нэг болон үйл ажиллагаагаа эхлүүлэв.
      - year: "2023"
        body: Компанийн стратеги болон брэндийн шинэчлэлийг хэрэгжүүлж, "Финко Капитал
          ББСБ" нэршилтэйгээр дижитал санхүүгийн шинэ үе шатаа эхлүүлэв.
      - year: "2024"
        body: Beep App -ийг зах зээлд нэвтрүүлж, богино хугацааны болон ажилтны онлайн
          зээлийн үйлчилгээг хэрэглэгчдэд хүргэв.
      - year: "2025"
        body: Жижиг, дунд бизнесийн санхүүжилтийн дижитал платформ болох FincoBiz-ийг
          нэвтрүүлж бизнесийн санхүүжилтийн үйл явцыг цахимжуулав.
      - year: "2025"
        body: Premium Nexus ХК -тай хамтран BeepCU Virtual Credit Card-ийг зах зээлд
          танилцуулж, embedded finance экосистемийг өргөжүүлэв.
      - year: "2026"
        body: Embedded finance-д суурилсан санхүүгийн үйлчилгээний хөгжүүлэлтийг
          өргөжүүлж, иргэн болон бизнесийн санхүүгийн экосистемийг нэг
          платформоор удирдах зорилтыг хэрэгжүүлж байна.
  ceo:
    headingLead: "Гүйцэтгэх захирлын "
    headingAccent: мэндчилгээ
    subheading: Хэрэглэгч бол бидний төв. Бид найдвартай, инновацтай, ухаалаг
      шийдлүүдийг ил тод, итгэлцэлтэйгээр хүргэж, өнөөдөр болон маргаашийн
      өсөлтийг хамтад нь бүтээдэг.
    greetingTitle: Мэндчилгээ
    greetingBody:
      - 2025 он Финкочууд бидний хувьд зөвхөн зээлийн багцын өсөлтийн жил
        байгаагүй, стратегийн чиглэлээ илүү тодорхой болгож, дижитал санхүүгийн
        шийдлүүдийг бодитоор хэрэгжүүлж эхэлсэн гарааны чухал үе байлаа. Бид
        технологид суурилсан санхүүгийн шийдлүүдийг хөгжүүлэхдээ зөвхөн
        бүтээгдэхүүн нэвтрүүлэхээс илүү хэрэглэгчийн өдөр тутмын амьдралыг
        хялбарчлах, бодит үнэ цэн бүтээхийг зорьж байна.
      - Түүнчлэн бид хэрэглэгч, харилцагчдынхаа өмнө хүлээсэн хариуцлагатай
        байдлаа хадгалж компанийн засаглал, эрсдэлийн удирдлага, мэдээллийн
        аюулгүй байдлын чиглэлд олон улсын жишиг стандартуудыг тогтвортой
        хэрэгжүүлж, харилцагчидтайгаа хамтдаа урт хугацааны өсөлтийн сууриа
        бэхжүүлж байна. Итгэлцэл бол бидний хамгийн чухал үнэт зүйл бөгөөд бид
        харилцагч, түнш бүртэйгээ ил тод, хариуцлагатай хамтран ажиллахыг
        эрхэмлэдэг. Финко Капитал нь хэрэглэгчдийнхээ хэрэгцээг ойлгож, бодит
        үнэ цэн бүтээж тэдний амьдралд ойр санхүүгийн шийдлүүдийг тууштай
        хөгжүүлэн, тогтвортой өсөлтийг бүтээдэг байх болно. Та бүхнийхээ итгэл,
        хамтын ажиллагаанд дахин талархал илэрхийлье. Бид хамтдаа илүү ухаалаг,
        шинэлэг, өсөлттэй санхүүгийн ирээдүйг бүтээх болно.
    tagline: Бүтээ, ирээдүйг зээгнэ…. Санхүүжүүлье.
    signatureLabel: "Гүйцэтгэх захирал:"
    signatureName: Л.Цолмон
