locale: mn
key: about
hero:
  eyebrow: Бидний тухай
  headline: Таны санхүүгийн ирээдүйг хамтдаа бүтээнэ
  subheadline: Finco Capital нь Beep, FincoBiz зэрэг дижитал санхүүгийн бүтээгдэхүүнийг хөгжүүлдэг ББСБ юм.
timeline:
  - year: "2023"
    title: Үндэс суурь
    body: Finco Capital байгуулагдаж, дижитал санхүүгийн үйлчилгээний анхны алхмуудаа хийсэн.
  - year: "2024"
    title: Beep Wallet
    body: Beep Wallet апп зах зээлд нэвтэрч, хэрэглэгчдэд хялбар төлбөрийн шийдлийг хүргэсэн.
  - year: "2025"
    title: Өргөтгөл
    body: Бүтээгдэхүүний хүрээгээ тэлж, бизнесийн санхүүжилтийн FincoBiz платформыг танилцуулсан.
  - year: "2026"
    title: Тэлэлт
    body: 71,000 гаруй харилцагчтай болж, санхүүгийн үйлчилгээгээ улам хүртээмжтэй болгосон.
leadership:
  name: Б. Болормаа
  role: Гүйцэтгэх захирал
  quote: Бид технологид суурилсан, ил тод санхүүгийн үйлчилгээгээр хүн бүрд боломжийг нээхийг зорьдог.
  photo: /images/leader.jpg
team:
  - name: Г. Батбаяр
    role: Санхүүгийн захирал
    bio: Санхүү, эрсдэлийн удирдлагын чиглэлээр 15 жилийн туршлагатай.
    avatar: /images/team-1.jpg
  - name: Д. Энхтөр
    role: Технологийн захирал
    bio: Дижитал бүтээгдэхүүн, платформ хөгжүүлэлтийг хариуцдаг.
    avatar: /images/team-2.jpg
  - name: С. Мөнхзул
    role: Маркетингийн захирал
    bio: Брэнд, харилцагчийн өсөлтийн стратегийг удирддаг.
    avatar: /images/team-3.jpg
  - name: Т. Ганбаатар
    role: Үйл ажиллагааны захирал
    bio: Салбар, үйлчилгээний чанарын удирдлагыг хариуцдаг.
    avatar: /images/team-4.jpg
  - name: Н. Тэмүүлэн
    role: Хүний нөөцийн захирал
    bio: Багийн соёл, авьяаслаг ажилтны хөгжлийг дэмждэг.
    avatar: /images/team-5.jpg
