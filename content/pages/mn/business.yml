locale: mn
key: business
hero:
  eyebrow: Бизнест
  headline: Бизнесийн өсөлтийг санхүүжүүлье
  subheadline: Эргэлтийн хөрөнгө, өргөтгөл, хөрөнгө оруулалтад зориулсан шийдлүүд.
faq:
  - question: Бизнесийн зээлд ямар баримт шаардлагатай вэ?
    answer: Аж ахуйн нэгжийн гэрчилгээ, санхүүгийн тайлан болон холбогдох баримтууд шаардлагатай.
  - question: Барьцаагүй зээл авах боломжтой юу?
    answer: Зарим бүтээгдэхүүн барьцаагүй нөхцөлтэй, мөнгөн урсгалд суурилсан үнэлгээгээр олгогдоно.
