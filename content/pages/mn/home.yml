valueProps:
  heading: Бүтээ, ирээдүйг эзэгнэ…
  accent: Санхүүжүүлье!
  subheading: Санхүүгийн шийдлийг нэг дор төвлөрүүлж, таны дараагийн өсөлтийг дэмжинэ.
  items:
    - title: Хурдан шийдвэр
      icon: hugeicons:time-quarter-pass
      body: Санхүүжилтийн хүсэлтийг тань датад суурилсан үнэлгээ, оновчтой процессоор богино хугацаанд шийдвэрлэж, бизнесийн тасралтгүй үйл ажиллагааг дэмжинэ.
