faq:
  - question: Зээл авахад ямар бичиг баримт бүрдүүлэх вэ?
    answer: Finco Capital ББСБ ХХК нь холбогдох хууль, тогтоомжийн хүрээнд санхүүгийн үйлчилгээ үзүүлдэг. Энэхүү вебсайтад байршуулсан мэдээлэл нь зөвхөн ерөнхий мэдээллийн зориулалттай бөгөөд аливаа санхүүгийн үйлчилгээний эцсийн нөхцөл, шийдвэрийг бүрэн илэрхийлэхгүй болно. Үйлчилгээний нөхцөл, шалгуур, эрхийн хэмжээ нь бүтээгдэхүүний төрөл болон харилцагчийн үнэлгээнээс хамааран өөр байж болно.
  - question: Салбар дээр заавал очих шаардлагатай юу?
    answer: Үгүй. Та Beep Wallet аппликейшн болон вэбсайтаар дамжуулан зээлийн хүсэлтээ бүрэн онлайнаар гаргах боломжтой.
  - question: Зээлийн хүсэлтийг онлайнаар хэрхэн гаргах вэ?
    answer: Beep Wallet аппликейшнд нэвтэрч, зээлийн төрлөө сонгон, шаардлагатай мэдээллээ бөглөөд хүсэлтээ илгээснээр ажлын богино хугацаанд хариу авна.
  - question: Зээл авахад ямар хүүгийн хэмжээтэй байдаг вэ?
    answer: Хүүгийн хэмжээ нь бүтээгдэхүүний төрөл, зээлийн хугацаа болон харилцагчийн зээлийн үнэлгээнээс хамаарч тогтоогдоно.
  - question: Зээлийн хугацааг сунгах боломжтой юу?
    answer: Тийм. Зарим бүтээгдэхүүний хувьд тогтсон нөхцөлийн дагуу зээлийн хугацааг сунгах боломжтой.
