# @nuxt/content's nitro dev bundle imports @nuxtjs/mdc from the project root,
# so it must be publicly hoisted under pnpm's strict layout.
publicHoistPattern:
  - '@nuxtjs/mdc'

allowBuilds:
  '@firebase/util': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@tsogtoodev/prelo'
  - '@tsogtoodev/particle-glock@0.1.0'
