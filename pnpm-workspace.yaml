# @nuxt/content's nitro dev bundle imports @nuxtjs/mdc from the project root,
# so it must be publicly hoisted under pnpm's strict layout.
publicHoistPattern:
  - '@nuxtjs/mdc'

allowBuilds:
  '@firebase/util': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true

# First-party packages: exempt from the release-age hold so a freshly published
# version can be installed the same day. Unversioned (like prelo) so each bump
# doesn't need an edit here — pin a version back if you'd rather admit them
# one at a time.
minimumReleaseAgeExclude:
  - '@tsogtoodev/prelo'
  - '@tsogtoodev/particle-glock'
